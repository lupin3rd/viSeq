# specs/state.yaml — session state (seed-conventions bootstrap)
# workflow_mode is the canonical integrate-mode signal: solo-git = commit
# directly on main with conventional commits; PR flow optional.

workflow_mode: solo-git

handoff:
  next_skill: null

active_flow: fix_bug
bug_cycle:
  current_step: 4
  completed_steps: [1, 2, 3]

git:
  branch: main
