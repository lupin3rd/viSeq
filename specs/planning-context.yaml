# specs/planning-context.yaml — written by elaborate-spec; consumed by scope-work and slice-tasks
feature_name: "Thumbnail pipeline v2 — never lose a thumbnail silently, and show up to 3 frames per media (grid cycling)"
problem_statement: >-
  On the real rig, 2 of 5 loaded media never got a thumbnail: the tiles stayed on
  "Loading thumbnail..." forever while the daemon silently dropped every request
  (verified live via process memory forensics + OSC probes — see
  specs/bugs/BUG-2026-08-26T230838-thumbnail-cache-lost-silently.md). The daemon's
  thumbnail generation is one-shot, memory-only, silent on failure, and a single
  failed extraction permanently empties the cache with no recovery path. Independently,
  the user wants the Mediagrid to show three frames per media (cycling) to identify a
  video from its content — a previous attempt to animate three thumbs was slow, so the
  new implementation must reuse static textures and switch references (configure_item),
  never re-decode or re-upload per cycle.
constraints:
  - "Frozen OSC contract: same addresses and payloads (/viosc/thumb/<id>, /viosc/replythumb/<name>/<idx>, /viosc/regen_thumb/<id>). The contract ALREADY supports multiple thumbs per source (the <idx> segment + 'all' arg) — no contract change is needed or allowed."
  - "Root-cause fixes live in the viOSC daemon (repo viosc, single file viosc.py, no test suite today — a minimal pytest setup is added there)."
  - "viseq.py remains a single file (no module split); new logic must keep the HIGH-1 invariant (no dpg calls from worker threads)."
  - "Performance: cycling = static textures created once + dpg.configure_item(texture_tag=...) on a wall-clock timer; NO per-cycle decode, NO texture create/delete churn, NO repeated OSC requests. Mediagrid gating (e07 P0) and idle render throttle (e07 P1) must keep working."
  - "Memory: up to 3 textures per source (~230 KB each at 320x180 RGBA float32); L-1 stale pruning extended to the 3-tag set."
  - "Fallback: media with <3 extractable frames (images, short clips) cycle what exists or stay static."
  - "Headless verification: pytest harness in both repos; dpg calls stubbed (existing test_fixes.py pattern)."
out_of_scope:
  - "Changes to Vimix or to the OSC contract."
  - "Cycling in the sequencer clip slots or monitor players (grid only for now; the shared texture list makes it trivial later)."
  - "Persisting thumbnails to disk (cache remains in-memory per session)."
  - "Generating >3 thumbs per media."
key_decisions:
  - decision: "Fold the bug fix (BUG-2026-08-26T230838) into this epic as story e10s01 (viosc generation hardening)."
    rationale: "The fix restructures the same generation code the multi-thumb work touches; doing it separately would be re-work."
  - decision: "3 thumbs per media, extracted at distinct jittered times (~15/50/85 % of duration); images/short clips fall back to fewer."
    rationale: "User goal: identify a video from three frames; the OSC contract and blob caps support it at negligible cost."
  - decision: "Cycling cadence 750 ms per frame, only while the Mediagrid is visible and the source has ≥2 frames."
    rationale: "Readable preview cadence; bounded CPU (≈1 configure_item/s per visible tile)."
  - decision: "Validate cycling cost with a quick measured spike before/after (SPIKE-perf pattern) rather than guessing."
    rationale: "The user's earlier 3-thumb animation was slow; the design avoids the classic causes, but we prove it."
