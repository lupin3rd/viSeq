# specs/product/SCOPE_LATEST.yaml — bounded PRD (scope-work)
# Consumed by: slice-tasks, plan-work, develop-tdd, verify-work

core_value: >-
  A source with valid media always gets a thumbnail — never lost silently, always
  recoverable — and the Mediagrid shows up to three frames per media, cycling, so a
  video is identifiable from its content at a glance.

summary: >-
  The thumbnail pipeline (viOSC daemon -> OSC -> viseq Mediagrid) currently loses
  thumbnails permanently: generation is one-shot, memory-only, silent on failure, and a
  single failed extraction empties the cache with no recovery path, leaving the tile on
  "Loading thumbnail..." forever (BUG-2026-08-26T230838, verified live). This initiative
  hardens the daemon side first — log every failure with a reason, never overwrite a good
  cache with an empty result, regenerate on demand when a request hits an empty cache with
  a valid URI — and makes the UI resilient (a failed state with retry instead of an
  endless spinner).

  On top of that hardening, the daemon generates up to three thumbs per media at distinct
  jittered times (~15/50/85 % of duration) and the Mediagrid cycles them (750 ms cadence)
  by switching the image widget's texture reference between three pre-loaded static
  textures — no per-cycle decode, no texture churn, no repeated OSC requests. Media with
  fewer extractable frames (images, short clips) cycle what exists or stay static. The
  frozen OSC contract already supports multiple thumbs per source (the <idx> segment and
  the "all" request arg), so no contract change is needed.

in_scope:
  - e10s01: "viOSC thumbnail generation hardening (implements BUG-2026-08-26T230838): reason-specific error logging for missing file / ffmpeg failure / empty output; failed regeneration never replaces a good cached thumbnail; an on-demand thumb request for a source with an empty cache but a valid URI regenerates and replies instead of silently returning."
  - e10s02: "viOSC generates up to 3 thumbs per media: count=3 with distinct jittered times (~15/50/85 % of duration), fallback to fewer frames for images/short clips, reply path already sends all indices via the 'all' arg."
  - e10s03: "viseq multi-thumb pipeline: propagate the reply index through the decoder, store up to 3 textures per source (tex_<name>_0/1/2), thumbnails_data becomes a list, L-1 pruning handles the 3-tag set, grid tile accepts the first texture immediately and the rest without churn."
  - e10s04: "Mediagrid thumb cycling: wall-clock cycle (750 ms) switching the tile image's texture_tag among stored frames via configure_item, gated to visible grid + sources with >=2 frames, static fallback otherwise, frame_sleep interplay decided by a measured spike (SPIKE-perf pattern); optional failed-state tile label with right-click retry."

out_of_scope:
  - "Changes to Vimix or to the frozen OSC contract (addresses and payloads)."  # contract frozen by convention; multi-thumb is already supported by <idx> + 'all'
  - "Cycling in the sequencer clip slots or monitor players (grid only; the shared per-source texture list makes extension trivial later)."  # deferred to keep the slice vertical and cheap
  - "Persisting thumbnails to disk between sessions."  # cache stays in-memory; disk cache is a later optimization
  - "Generating more than 3 thumbs per media."  # bounded by the user's goal; raises transport/decode cost for no added value

constraints:
  - "Runtime: Python 3.13, dearpygui 2.3.1 (viseq), python-osc (both); NO new dependencies."
  - "HIGH-1: worker threads never call dpg — the decoder stays a background thread, texture upload and configure_item stay on the main thread."
  - "Performance: cycling must NOT re-decode, re-upload, or re-request per cycle; Mediagrid gating (e07 P0) and idle render throttle (e07 P1) must keep working."
  - "Memory: <=3 textures per source (~230 KB each); L-1 stale pruning extended to the 3-tag set."
  - "The viOSC daemon repo (viosc) gains a minimal pytest test suite for the thumbnail paths."
  - "Headless verification: pytest in both repos with the existing dpg-stub harness."

success_criteria:
  - "A source whose thumbnail generation fails once still gets a thumbnail on a later request or regen (no permanent 'Loading...')."
  - "The daemon logs every thumbnail failure with a reason."
  - "Each media with a valid video yields up to 3 distinct frames; images/short clips yield 1-2."
  - "The Mediagrid tile cycles the 3 frames at ~750 ms while the grid is visible; it stays static when only one frame exists."
  - "Cycling cost is measured (spike) and bounded: no measurable frame-rate impact with 20-50 sources."
  - "All new tests pass in both repos; existing tests still pass; the OSC contract is unchanged."

