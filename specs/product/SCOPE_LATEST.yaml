# specs/product/SCOPE_LATEST.yaml — bounded PRD (scope-work)
# Consumed by: slice-tasks, plan-work, develop-tdd, verify-work

core_value: >-
  Make the step-cell color feedback visible and the OSC plumbing zero-setup: the
  ColorV/ColorR step squares become larger and centered in the step button, and the app
  connects the OSC client and starts the listening server automatically at launch.

summary: >-
  viseq (audio-reactive VJ controller for Vimix via the viOSC daemon) runs on Python 3.13 +
  DearPyGui 2.3.1 after the e01 migration. Two usability gaps remain. First, the color
  square in ColorV/ColorR step cells is small (70x25) and left-aligned, so the feedback for
  the color OSC message is hard to see — the user wants a larger square centered in the step
  button (same treatment for every OSC message that uses the color square, i.e. ColorV and
  ColorR). Second, every launch currently requires two manual clicks ("Connect Client" and
  "Start Server") before any OSC traffic flows; the app should do this automatically at boot
  with the default addresses, keeping the manual buttons as override/fallback.

  This initiative delivers both with minimal, testable changes: a layout tweak inside the
  step-cell builder and an autostart call wired into the boot sequence, with the server
  start/client connect logic extracted into testable core functions. The frozen OSC contract
  with viOSC is untouched. Verification is headless (stub harness) plus the user's manual
  acceptance on the real rig.

in_scope:
  - e02s01: "Step-cell color square polish: ColorV and ColorR color_edit squares grow larger and are centered inside the 90x90 step cell; interactive behavior (picker on ColorV, read-only display on ColorR, right-click step menu) preserved."
  - e02s02: "OSC autostart: at boot the app connects the OSC client to viOSC (default 127.0.0.1:6666) and starts the listening server (default 127.0.0.1:6667) without user action; the existing 'Connect Client' / 'Start Server' buttons remain and work as before (including stop/toggle)."

out_of_scope:
  - "Resizing or re-layout of the other step widgets (AlphaV/AlphaR/AlphaF/SeekR controls) — deferred: only the color square is requested."
  - "New OSC endpoints, addresses, or payloads — the viOSC contract is frozen."
  - "Auto-reconnect or connection watchdog logic — deferred: not requested."
  - "Changes to viOSC or Vimix — external, contract frozen."
  - "Module split of viseq.py — deferred decision from e01 still holds."

constraints:
  - "Runtime: Python 3.13, dearpygui 2.3.1, single-file viseq.py (no module split)."
  - "OSC contract with viOSC is frozen (addresses and payloads in planning-context.yaml)."
  - "All UI mutations from worker threads must go through ui_task_queue (HIGH-1)."
  - "No dpg API calls before create_context() (spike landmine)."
  - "Autostart must fail gracefully: if the listen port is busy, the server status shows the error and the button stays usable."
  - "Verification is headless (stub harness) + user manual acceptance; real GUI rendering cannot be verified headless."

success_criteria:
  - "ColorV and ColorR squares are visibly larger and horizontally centered in the step cell."
  - "Clicking a ColorV square still opens the color picker and sends the picked color."
  - "At launch, the client status reads 'Ready on 127.0.0.1:6666' and the server status reads 'Listening on 127.0.0.1:6667' with no clicks."
  - "Manual client/server buttons still toggle/stop correctly."
  - "Regression harness fully green (existing 23 tests + new ones)."

references:
  - "specs/planning-context.yaml (frozen OSC contract)"
  - "specs/bugs/BUG-2026-08-21T222712-colorr-square-not-painted.md (prior color-square fix: DPG color API is 0..255)"
