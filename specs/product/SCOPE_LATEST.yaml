# specs/product/SCOPE_LATEST.yaml — bounded PRD (scope-work)
# Consumed by: slice-tasks, plan-work, develop-tdd, verify-work

core_value: >-
  Cut viseq's measurable CPU waste (measured in SPIKE-perf): stop re-setting unchanged
  Mediagrid cells on every viOSC state push, render at full rate only while something
  animates, and stop re-configuring unchanged monitor widgets every frame.

summary: >-
  A headless profiling spike (specs/archive/spikes/SPIKE-perf.md) measured the app's hot
  paths. Python-side work is mostly cheap (FFT 0.07 ms, essentia BPM 18 ms @1 Hz), but two
  costs are real and removable: (1) update_vimix_sources_ui runs a per-source loop on every
  viOSC state push — ~2 bind/configure + ~18 set_value per source per push (raw-table cells
  and tile readouts) — even when nothing changed; (2) the main loop renders at 60 fps
  unconditionally while the render cost scales with live widget count; (3) every monitor
  player re-configures its arm/speed/alpha/seek widgets every frame even when static.

  This initiative fixes the three measured costs without any visible behavior change:
  (P0) the Mediagrid's structural updates (tile theme/title/index badge) become
  signature-gated (current_source joins the signature) and value updates (tile alpha, raw
  table cells) become per-cell cached, so a push that changes nothing performs no dpg
  calls; (P1) the main loop renders at ~60 fps while animating (sequencer running,
  spectrum on, any monitor video playing) and ~30 fps while idle; (P2) monitor players
  skip configure_item when the displayed value is unchanged and when the disc is not
  spinning. Behavior, look, and the OSC contract are untouched.

in_scope:
  - e07s01: "P0 — Mediagrid per-push cost: add current_source to the rebuild signature and move the structural per-source updates (tile theme/title/index badge) inside the signature guard; introduce a per-cell value cache for tile_alpha and the raw vimix table cells so unchanged values skip set_value entirely. Measured target: an identical state push performs zero dpg calls (was ~20/source)."
  - e07s02: "P1 — Idle render throttling: a frame_sleep() decision (full rate while is_playing or spectrum on or any monitor video playing; throttled rate otherwise) drives the main-loop sleep. No change to frame work, only cadence."
  - e07s03: "P2 — Monitor refresh: refresh_monitor_display skips configure_item when the disc arm is not advancing (video paused), and caches last speed/alpha/seek per player so unchanged values are not re-configured every frame."

out_of_scope:
  - "Reducing the Mediagrid's live widget count (7k widgets @200 sources) — structural, needs a real-rig frame-time measurement first (SPIKE-perf P3)."
  - "Changing the OSC contract, the JSON payload handling, or the viOSC interaction."
  - "Touching the spectrum FFT, essentia cadence, fade ticks, or thumbnail decoding (measured negligible)."
  - "Module split of viseq.py — a maintainability refactor, zero performance benefit (deferred decision from e01 still holds)."
  - "GPU-side tuning (vsync, multi-viewport) — not measurable headless."

constraints:
  - "Runtime: Python 3.13, dearpygui 2.3.1, single-file viseq.py (no module split)."
  - "OSC contract with viOSC is frozen; payload shape and update cadence are inputs, not changed."
  - "No visible behavior change: same look, same controls, same values shown; only the amount of redundant dpg work changes."
  - "All UI mutations stay on the main thread (HIGH-1); the new caches are main-thread state."
  - "Verification is headless (stub harness: call-count and value assertions) + the user's manual acceptance on the real rig (frame feel at idle, media grid with real viOSC sources)."

success_criteria:
  - "An identical viOSC state push triggers zero dpg calls in update_vimix_sources_ui (regression test asserts no bind_item_theme/configure_item/set_value on the second identical push)."
  - "A value-only change (e.g. alpha) updates exactly the affected cells (tile alpha + raw cell), not the whole grid."
  - "Selecting a different source (current_source change) still refreshes the tile themes (signature covers it)."
  - "frame_sleep() returns the throttled rate while idle and the full rate while playing/spectrum/monitor-video-active (regression test)."
  - "refresh_monitor_display with unchanged props performs no configure_item for the arm/speed/alpha/seek widgets; a changed seek updates only the seek fill."
  - "Full regression suite green (115 tests + new ones); preflight green; manual acceptance on the real rig."

references:
  - "specs/archive/spikes/SPIKE-perf.md (measured hot paths and numbers)"
  - "specs/planning-context.yaml (frozen OSC contract)"
  - "specs/tech-architecture/tech-stack.md"
  - "specs/epics/e06-settings-window-features/ (prior e06 work, same file)"
