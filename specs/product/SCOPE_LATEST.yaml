# specs/product/SCOPE_LATEST.yaml — bounded PRD (scope-work)
# Consumed by: slice-tasks, plan-work, develop-tdd, verify-work

core_value: >-
  Restructure the app shell around a proper menubar: the OSC configuration moves into a
  hidden "Settings" window opened from the top bar, a "Show" menu opens the previously
  always-visible Logs window (now hidden by default, newest log first), and the sequencer
  clip slot becomes a clean centered assign button with no table frame around it.

summary: >-
  viseq (audio-reactive VJ controller for Vimix via the viOSC daemon) currently opens every
  utility window at boot: viOSC config, OSC Logs, Audio analyzer, Vimix Media — cluttering a
  1700x1000 screen. The user wants a conventional app-shell pattern: a top menubar with
  "Settings" (opens the general settings window, which today contains only the OSC section and
  will host more fields later), and "Show" (opens optional windows, starting with "Logs").
  Both the settings and logs windows become hidden by default and re-open from the menu; the
  logs render newest-first. In the sequencer, the rightmost clip-assign slot keeps its assign
  button (thumbnail / waiting / "ASSIGN CLIP") but drops the bordered child-window frame and
  centers the button vertically and horizontally in the row.

  The frozen OSC contract, sequencer engine, and monitor players are untouched. The viOSC
  window's content (client/server setup + raw state table) moves verbatim into the Settings
  window under an "OSC" section header. Verification is headless (stub harness) plus the
  user's manual acceptance on the real rig.

in_scope:
  - e03s01: "Settings window: the viOSC window becomes a hidden-by-default 'Settings' window (tag settings_window, closable, reopened from a 'Settings' entry in the top menubar); its content is grouped under an 'OSC' section; autostart OSC keeps working with the window hidden."
  - e03s02: "Show menu + Logs: a 'Show' menu in the top menubar opens the Logs window (hidden by default, tag logs_window, closable); log lines render newest-first (latest at the top)."
  - e03s03: "Clip slot polish: the rightmost sequencer slot keeps its assign button (thumbnail / waiting / ASSIGN CLIP, click to assign) but is centered in the row and rendered without the bordered child-window/table frame — only the button visible."

out_of_scope:
  - "New settings fields beyond the existing OSC section — deferred: the window is prepared for them, none added."
  - "Moving the Audio analyzer or Vimix Media windows behind the Show menu — deferred: not requested."
  - "Monitor player changes (window layout, menu behavior) — untouched."
  - "Log autoscroll, filtering, persistence, or levels — deferred: only the display order changes."
  - "New OSC endpoints, addresses, or payloads — the viOSC contract is frozen."
  - "Module split of viseq.py — deferred decision from e01 still holds."

constraints:
  - "Runtime: Python 3.13, dearpygui 2.3.1, single-file viseq.py (no module split)."
  - "OSC contract with viOSC is frozen (addresses and payloads in planning-context.yaml)."
  - "All UI mutations from worker threads must go through ui_task_queue (HIGH-1)."
  - "No dpg API calls before create_context() (spike landmine)."
  - "autostart_osc must keep working with the settings window hidden (status labels are set on hidden items)."
  - "Verification is headless (stub harness) + user manual acceptance; real GUI rendering cannot be verified headless."

success_criteria:
  - "At boot only the sequencer, audio analyzer, and media library windows are visible; settings and logs are closed."
  - "The menubar has 'Settings' (opens the settings window) and 'Show' > 'Logs' (opens the logs window); both windows can also be closed with their X."
  - "The OSC log shows the newest line at the top."
  - "The clip slot shows only the assign button/thumbnail, centered in the row, with no bordered frame."
  - "Regression harness fully green (existing 34 tests + new ones)."

references:
  - "specs/planning-context.yaml (frozen OSC contract)"
  - "specs/epics/e02-step-ui-polish/ (prior UI polish: DPG color API 0..255, color_button swatch, WindowPadding-aware centering)"
