# specs/product/SCOPE_LATEST.yaml — bounded PRD (scope-work)
# Consumed by: slice-tasks, plan-work, develop-tdd, verify-work

core_value: >-
  Add a simple selectable-band spectrum analyzer to the Audio analyzer window: vertical-bar
  FFT spectrum, a modifiable band-selection rectangle, and the selected band's normalized
  level (0..1) exposed as a program variable for future features.

summary: >-
  viseq's Audio analyzer window currently shows only a VU level bar when level analysis is
  enabled. The user wants a simple spectrum analyzer: vertical bars over the audible range,
  plus a modifiable selection box (band range) whose normalized average level (0..1) becomes
  a live program variable for future use (e.g. audio-reactive features).

  This initiative adds a dedicated spectrum worker (~30 FPS, Hann-windowed 2048-sample FFT on
  the existing ring buffer) that bins magnitudes into 32 bars (dB scale, -60 dBFS floor),
  drawn in a drawlist in the audio window; two Start/End sliders (0..1 of the spectrum) plus
  a translucent overlay rectangle define the selected band; the band's mean bar level is
  shown as text and stored in the module variable `audio_band_value` (0..1). The frozen OSC
  contract, sequencer, and monitor players are untouched. The existing VU level bar is
  replaced by the spectrum; BPM analysis and low-pass flag stay unchanged.

  Verification is headless (stub harness + pure-function tests for FFT/bin/band math) plus
  the user's manual acceptance on the real rig.

in_scope:
  - e04s01: "Spectrum engine: spectrum_analyzer_loop worker (Hann FFT -> 16 normalized bars 0..1, ~30 FPS) with pure compute_spectrum_bars()/band_value_from_bars() helpers; bars redrawn in the audio window drawlist via the main-thread task queue."
  - e04s02: "Three selectable bands: band1/band2/band3, each individually enabled/disabled by a checkbox (disabled = not computed, overlay hidden); each band has its own Start/End range sliders and translucent rectangle; enabled bands' mean levels are displayed and stored in the band1/band2/band3 module variables (0..1) for future features."

out_of_scope:
  - "Directly draggable selection boxes (drag the rectangles on the spectrum with the mouse) — deferred: the per-band Start/End sliders + overlays satisfy the current need."
  - "More than three bands — band1/band2/band3 cover the need; more bands would need the same pattern."
  - "FFT display modes (log-frequency axis, peak-hold, smoothing) — deferred: simple linear bars."
  - "Using band1/band2/band3 in any feature yet — they are exposed as variables for future work, nothing consumes them in this initiative."
  - "Changes to BPM analysis, low-pass flag, the OSC contract, or monitor players."
  - "Module split of viseq.py — deferred decision from e01 still holds."

constraints:
  - "Runtime: Python 3.13, dearpygui 2.3.1, numpy >=2,<3, single-file viseq.py (no module split)."
  - "OSC contract with viOSC is frozen (addresses and payloads in planning-context.yaml)."
  - "All UI mutations from worker threads must go through ui_task_queue (HIGH-1)."
  - "No dpg API calls before create_context() (spike landmine)."
  - "The spectrum worker must never die from an exception (graceful degradation, BLE001/S110 posture)."
  - "audio_band_value is written on the main thread (inside the queued UI task) and read by future main-thread features."
  - "Verification is headless (stub harness) + user manual acceptance; real GUI rendering cannot be verified headless."

success_criteria:
  - "With level analysis on, the audio window shows a live 16-bar vertical spectrum responding to the source."
  - "Bands 1-3 are individually enable/disable-able; disabled bands cost nothing (not computed, overlay hidden) and their variables stay 0."
  - "Each enabled band's range (Start/End) selects a spectral region; its mean level is shown and stored in band1/band2/band3 (0..1)."
  - "Silence yields near-zero bars and band values; a pure tone lights the bars around its frequency."
  - "The VU level bar is replaced by the spectrum; BPM/low-pass controls unchanged."
  - "Regression harness fully green (existing 50 tests + new ones)."

references:
  - "specs/planning-context.yaml (frozen OSC contract)"
  - "specs/tech-architecture/tech-stack.md"
  - "specs/epics/e02-step-ui-polish/ (prior UI polish: DPG color API 0..255, color_button swatch, WindowPadding-aware centering)"
