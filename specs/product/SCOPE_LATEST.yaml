# specs/product/SCOPE_LATEST.yaml — bounded PRD (scope-work)
# Consumed by: slice-tasks, plan-work, develop-tdd, verify-work

core_value: >-
  Let the user drive viseq from any MIDI controller — first the Novation Launchpad as an
  8x8 hardware view of the step sequencer (buttons toggle steps, the pads' LEDs mirror the
  sequencer state) — through a configurable, user-learnable mapping engine that binds
  arbitrary MIDI notes and CCs to viseq actions.

summary: >-
  viseq already depends on mido + python-rtmidi for MIDI clock sync. This initiative adds a
  full MIDI control layer on top of that single stack, in three layers: (1) a mapping
  engine — a configurable list of bindings {device, channel, type (note/cc), number,
  action, params} persisted in viseq_config.json, dispatched by a worker thread whose
  action executions are routed to the main thread through the existing ui_task_queue
  (HIGH-1 invariant); (2) a MIDI Learn flow — the user first clicks the viseq control they
  want to control, then presses the MIDI button (or moves the knob) that should trigger it,
  and the binding is created; the menubar gains a "MIDI" menu with Enable, Learn, a
  Mappings window (list + delete) and Save; (3) a Novation Launchpad adapter — model
  auto-detection from the port name (MK2 family: native note mode; Launchpad X / Mini MK3:
  programmer-mode SysEx), the 8x8 pad grid maps 1:1 to the step sequencer (auto-generated
  bindings, not stored in user config), and the pad LEDs mirror step state (active = green,
  empty = off, current playhead = white/amber, beat flash).

  Scope for v1 is the sequencer window (user decision): step toggle, transport
  (play/stop, resync, tap, nudge) and clip-assign buttons are learnable. The engine
  supports CC bindings end-to-end (capture, store, dispatch with the controller value);
  concrete CC-driven actions (e.g. monitor volume) come with the monitor-player scope later.

in_scope:
  - e09s01: "MIDI mapping engine: binding schema in viseq_config.json (midi section: enabled, input_port, bindings), pure matching (binding_matches), resolve_midi_message -> actions, action vocabulary for the sequencer (seq_toggle, transport_play/resync/tap/nudge, beat_source, track_assign), midi_control_loop worker routing executions through ui_task_queue, enable/disable."
  - e09s02: "MIDI Learn + menu: learn mode (click a learnable viseq control -> capture action -> press MIDI button -> create binding), learnable wrappers on sequencer widgets, 'MIDI' menubar menu (Enable checkbox, Learn, Mappings window with per-binding Delete, Save to config)."
  - e09s03: "Novation Launchpad adapter: model detection from port name (MK2/Mini MK2/Pro native note mode; X/Mini MK3 programmer-mode SysEx F0 00 20 29 02 0C ...), 8x8 grid -> seq_toggle auto-bindings, LED mirror of the sequencer (step state colors, playhead, beat flash), output via mido with a lock, safe no-op when no device."

out_of_scope:
  - "Monitor-player / spectrum-analyzer MIDI control — deferred to a later epic (user: 'iniziare dalla finestra sequencer 8x8, poi vedremo')."
  - "CC-driven continuous actions in v1 — the engine stores and dispatches CC bindings with their value, but no sequencer action consumes the value yet (deferred with the monitor scope)."
  - "SysEx message bindings in the user mapping engine — v1 covers note + control_change only (Launchpad programmer-mode SysEx is handled internally by the adapter)."
  - "Any change to the frozen OSC contract with viOSC/Vimix."
  - "Multi-device parallel control (two controllers at once) — one input port at a time in v1."
  - "i18n or a MIDI preset manager beyond Save/Delete of the current mapping list."

constraints:
  - "Runtime: Python 3.13, dearpygui 2.3.1, mido 1.3.3 + python-rtmidi 1.5.8 (already in requirements.txt — NO new dependencies)."
  - "HIGH-1: the MIDI worker thread never touches dpg directly; action executions and learn-capture UI updates are pushed to the main thread via ui_task_queue."
  - "Config compatibility: existing viseq_config.json files (layout + theme only) must keep working — the midi section merges in with defaults (load_config deep-merge already provides this)."
  - "Launchpad protocol knowledge comes from the official Programmers Reference (MK2 note mode: grid notes row*10+col, velocity = LED color; SysEx header F0 00 20 29 02 0C; MK3/X need programmer-mode SysEx) — exact per-model tables are finalized in the spike/implementation and validated on the user's real hardware."
  - "Headless verification via the stub harness + mido being real (no ports on CI -> worker logs once and idles; all engine logic is pure and unit-tested)."

success_criteria:
  - "A user-learned binding {device, channel, type, number, action, params} persisted in the config round-trips load/save and dispatches the right action with the right params (unit tests)."
  - "A CC binding dispatches with its controller value; a note binding dispatches on note-on edges (unit tests)."
  - "The learn flow creates a binding from 'click GUI control -> press MIDI button' without manual JSON editing, and the Mappings window shows it with working Delete (stub tests + manual acceptance)."
  - "With a Launchpad connected, pressing pad (r,c) toggles step (r,c), and the pad LEDs mirror the sequencer (step active/empty/playhead/beat) (manual acceptance on the user's real hardware; protocol tables unit-tested headless)."
  - "Existing configs without a midi section load unchanged; full regression suite green; preflight green."

references:
  - "Novation Launchpad MK2 Programmers Reference Manual v1.03 (grid notes row*10+col, velocity = color, SysEx header F0 00 20 29 02 0C)"
  - "Novation Launchpad X user guide (programmer mode for MK3-family)"
  - "specs/tech-architecture/tech-stack.md"
  - "specs/epics/e06-settings-window-features/e06s01-window-layout.md (config merge pattern)"
  - "specs/epics/e08-help-window/ (menubar + window patterns)"
