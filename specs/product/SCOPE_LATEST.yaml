# specs/product/SCOPE_LATEST.yaml — bounded PRD (scope-work)
# Consumed by: slice-tasks, plan-work, develop-tdd, verify-work

core_value: >-
  Give the user a one-click "Help" entry in the top menubar that opens an About window,
  centered on the viewport, showing the viseq ASCII-art logo, the license (GPL-3.0) and
  the author (Luca Franceschini aka Lupin3rd).

summary: >-
  viseq has no way to discover what it is, who wrote it, or under which license it is
  distributed. This initiative adds a "Help" entry in the viewport menubar (next to the
  existing "Settings" entry) that opens a small hidden-until-then About window always
  centered on the screen. The window shows the ASCII-art logo the user supplied (rendered
  in a monospace font when one is available, with a graceful fallback), the app name, the
  license line (GPL-3.0) and the author line (Luca Franceschini aka Lupin3rd).

  The About window follows the exact pattern already proven by e03 (Settings/Logs): a
  hidden boot window (show=False, closable with X), opened by a menubar callback. It is
  NOT part of the layout save/restore (it is a dialog, not workspace) and it is NOT
  tracked by LAYOUT_WINDOW_TAGS. The centering math is a pure, unit-tested helper
  (centered_window_pos) that the show callback feeds with the live viewport/window sizes.

in_scope:
  - e08s01: "Help menubar entry (label 'Help') opening an About window (tag help_window, hidden at boot, closable with X) always centered on the viewport; window content = ASCII-art logo (monospace font when available, default font fallback), app title, license line 'GPL-3.0', author line 'Luca Franceschini aka Lupin3rd'."

out_of_scope:
  - "Version number or changelog in the About window — the user asked only for logo + license + author; a version line would need a maintained APP_VERSION constant (deferred, can be added when the app gains versioning)."
  - "Layout save/restore integration for help_window — it is a transient dialog; it must not appear in LAYOUT_WINDOW_TAGS and a saved layout must never re-open it at boot."
  - "Localization of the menubar (Help stays English, consistent with Monitor/Show/Settings)."
  - "A modal/always-on-top window — the window is closable, movable and can be re-centered on next open."
  - "Any change to the OSC contract, sequencer, media grid or existing windows."

constraints:
  - "Runtime: Python 3.13, dearpygui 2.3.1, single-file viseq.py (no module split)."
  - "UI mutations stay on the main thread (HIGH-1): the help window is created at boot and shown from a menu callback — no worker involvement."
  - "Headless verification via the stub harness (tests/test_fixes.py): import-time window snapshot, pure centering math, callback assertions."
  - "Monospace font loading must be defensive (os.path.exists guard) and must not crash headless tests where no font file exists."

success_criteria:
  - "Menubar shows a 'Help' entry whose callback opens the help window."
  - "Opening the window re-centers it on the viewport: centered_window_pos(viewport, window) returns ( (vp_w - w) // 2, (vp_h - h) // 2 ) clamped at >= 0, and show_help_window applies it via set_item_pos + show_item."
  - "The window is hidden at boot, closable with X, and its content includes the full supplied ASCII logo, the GPL-3.0 license line and the 'Luca Franceschini aka Lupin3rd' author line."
  - "help_window is not in LAYOUT_WINDOW_TAGS; test_layout_window_tags_cover_all_fixed_windows stays green unchanged."
  - "Full regression suite green (123 existing tests + new ones); preflight green; manual acceptance on the real rig."

references:
  - "specs/epics/e03-window-manager-restructure/e03s02-show-logs.md (prior hidden-window + menubar pattern)"
  - "specs/epics/e06-settings-window-features/e06s01-window-layout.md (LAYOUT_WINDOW_TAGS / LAYOUT_ALWAYS_HIDDEN_TAGS contract)"
  - "specs/tech-architecture/tech-stack.md"
