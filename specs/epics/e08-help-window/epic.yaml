# specs/epics/e08-help-window/epic.yaml — capsule manifest (slice-tasks)
id: e08
slug: help-window
title: "Help menu entry + centered About window (ASCII logo, version, GPL-3.0, author) + English UI pass"
status: in_progress
context: >-
  viseq has no About/help surface. The user wants a "Help" entry in the top menubar that
  opens a window always centered on the viewport with the viseq info: the ASCII-art logo
  (supplied by the user), the version, the license (GPL-3.0) and the author (Luca
  Franceschini aka Lupin3rd). The window follows the proven e03 pattern (hidden boot
  window, show=False, closable with X, opened by a menubar callback). It is a transient
  dialog: not part of the layout save/restore (LAYOUT_WINDOW_TAGS untouched) and never
  re-opened by a layout restore. The ASCII logo needs a monospace font to align; load
  DejaVu Sans Mono defensively (os.path.exists over a few common Linux paths) and fall
  back to the default font when absent — headless tests must not depend on font presence.
  The same initiative also makes the whole UI English (the user asked to re-check the
  language): theme presets (Dark/Light/Custom), beat-source labels, Settings sections,
  buttons and checkbox, and the About-window lines. Only displayed text changes — tags,
  config keys (scuro/chiaro/custom) and behavior stay untouched.
stories:
