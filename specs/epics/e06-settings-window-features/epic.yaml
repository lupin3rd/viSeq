id: e06
slug: settings-window-features
title: "Settings window: window-layout save/restore + simple theming (dark/light presets and custom colors)"
status: in_progress
delta: ENHANCED   # adds two new Settings sections; no behavior/contract change for OSC or sequencer
context: >-
  The Settings window (e03s01) currently hosts only the OSC section. The user wants two new
  conveniences there: (1) save the current window layout — which windows are open, their
  position and size — to a JSON config file and restore it (buttons + optional restore at
  boot), and (2) a simple theme picker so the user can decide dark/light background and the
  colors of texts and lines, applied live and persisted. All colors in viseq are hard-coded
  today; this epic routes the chrome colors (window/panel backgrounds, borders, text,
  spectrum bars) through a named palette with a 'Scuro' default that reproduces the current
  look exactly. The config file (viseq_config.json next to viseq.py) stores both the layout
  and the theme.
