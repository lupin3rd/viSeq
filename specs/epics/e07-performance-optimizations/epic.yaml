# specs/epics/e07-performance-optimizations/epic.yaml — capsule manifest (slice-tasks)
id: e07
slug: performance-optimizations
title: "Cut measured CPU waste: Mediagrid per-push gating (P0), idle render throttle (P1), monitor refresh skip (P2)"
status: in_progress
delta: ENHANCED   # removes redundant dpg work only; no behavior/contract change, no visual change
context: >-
  SPIKE-perf measured the hot paths headless. Python-side math is negligible; the real,
  removable costs are: (P0) update_vimix_sources_ui re-sets ~20 dpg values per source on
  every viOSC state push even when nothing changed; (P1) the main loop renders at 60 fps
  unconditionally; (P2) every monitor player re-configures its arm/speed/alpha/seek widgets
  every frame even when static. This epic removes the redundant work with no visible change:
  structural Mediagrid updates become signature-gated (current_source joins the signature),
  value updates become per-cell cached, the frame sleep throttles when idle, and monitor
  refresh skips unchanged configures. The widget-count reduction of the Mediagrid (7k @200
  sources) is deferred pending a real-rig render measurement (SPIKE-perf P3).
stories:
  - id: e07s01
    title: "P0 — Mediagrid per-push cost: signature-gated structural updates + per-cell value cache"
    bcps: 3
    delta: ENHANCED
  - id: e07s02
    title: "P1 — Idle render throttle: frame_sleep() full rate while animating, throttled while idle"
