# specs/epics/e04-spectrum-analyzer/epic.yaml — capsule manifest (slice-tasks)
id: e04
slug: spectrum-analyzer
title: "Selectable-band spectrum analyzer in the audio window"
status: in_progress
delta: ENHANCED   # new audio visualization + a program variable; no contract change
context: >-
  The Audio analyzer window only shows a VU level bar. The user wants a simple vertical-bar
  spectrum analyzer plus a modifiable band-selection rectangle whose normalized level (0..1)
  is exposed as a program variable for future audio-reactive features. A dedicated worker
  (~30 FPS) computes a Hann-windowed 2048-sample FFT on the existing ring buffer, bins
  magnitudes into 32 bars (dB scale, -60 dBFS floor, 0..1), and enqueues the redraw to the
  main thread (HIGH-1). Two Start/End sliders (0..1) define the band; a translucent rectangle
  overlays the selection; the band mean is displayed and continuously stored in
  `audio_band_value`. The VU progress bar is replaced by the spectrum; BPM/low-pass and the
  frozen OSC contract are untouched.
