# specs/epics/e09-midi-control/epic.yaml — capsule manifest (slice-tasks)
id: e09
slug: midi-control
title: "MIDI control: configurable mapping engine (any device), MIDI Learn + menu, Novation Launchpad adapter with sequencer LED mirror"
status: in_progress
delta: ENHANCED   # additive control layer on mido (already a dependency); no behavior/contract change for OSC, sequencer internals or config keys
context: >-
  viseq already ships mido 1.3.3 + python-rtmidi for MIDI clock sync. The user wants full
  MIDI control: any MIDI device can drive viseq through user-configurable bindings
  (notes and CCs), captured via a MIDI Learn flow (click the viseq control first, then the
  MIDI button), managed from a new "MIDI" menubar menu (enable, learn, mappings list +
  delete, save). A Novation Launchpad adapter makes the 8x8 pad grid a hardware mirror of
  the step sequencer: pads toggle steps and the pad LEDs show step state, playhead and
  beat. v1 scope is the sequencer window; monitor/analyzer control comes later. Protocol
  facts (verified from Novation references): MK2-family grid buttons are notes row*10+col
  with velocity = LED color; the SysEx header is F0 00 20 29 02 0C; Launchpad X / Mini MK3
  require programmer-mode SysEx before they act as a note grid. Model auto-detection by
  port name covers the family without asking the user. The worker thread follows HIGH-1:
  it resolves bindings and pushes action executions to ui_task_queue; LED sends are
  lock-guarded main-thread writes to a mido output port (no-op headless).
