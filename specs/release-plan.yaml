# specs/release-plan.yaml — WSJF-ordered epic list (slice-tasks)
# All stories in e01 belong to one epic; order = WSJF (value per unit of work).

release: 1.1.0

epics:
  - id: e01
    slug: dpg2x-port
    title: "viseq DearPyGui 2.x migration (Python 3.13) + audit hygiene fold-in"
    wsjf: 100
    baseline_bcps: 15
    stories:
      - id: e01s01
        title: "Boot on DearPyGui 2.3.1 (tracer bullet)"
        bcps: 3
      - id: e01s02
        title: "Sequencer + fade engine on 2.x"
        bcps: 5
      - id: e01s03
        title: "OSC + state sync + media grid + thumbnails + monitor players on 2.x"
        bcps: 3
      - id: e01s04
        title: "Audio analysis (VU/BPM) + ring buffer on 2.x"
        bcps: 2
      - id: e01s05
        title: "Hygiene (type hints, EN comments, constants) + manual acceptance"
        bcps: 2

  - id: e02
    slug: step-ui-polish
    title: "Step-cell color square polish + OSC autostart"
    wsjf: 60
    baseline_bcps: 5
    stories:
      - id: e02s01
        title: "Larger centered color square in ColorV/ColorR step cells"
        bcps: 2
      - id: e02s02
        title: "Auto-start OSC client + listening server on launch"
        bcps: 3

  - id: e03
    slug: window-manager-restructure
    title: "Menubar shell: Settings window, Show menu + Logs (newest-first), borderless clip slot"
    wsjf: 50
    baseline_bcps: 6
    stories:
      - id: e03s01
        title: "Settings window (hidden, opened from menubar) hosting the OSC config section"
        bcps: 2
      - id: e03s02
        title: "Show menu + Logs window (hidden by default) with newest-first rendering"
        bcps: 2
      - id: e03s03
        title: "Clip slot: centered bare assign button, no table frame"
        bcps: 2

  - id: e04
    slug: spectrum-analyzer
    title: "Selectable-band spectrum analyzer in the audio window"
    wsjf: 55
    baseline_bcps: 6
    stories:
      - id: e04s01
        title: "Spectrum engine: FFT worker + 32 normalized bars in a drawlist"
        bcps: 3
      - id: e04s02
        title: "Band selection: Start/End sliders + rectangle overlay + audio_band_value variable"
        bcps: 3

  - id: e06
    slug: settings-window-features
    title: "Settings window: window-layout save/restore + simple theming (Scuro/Chiaro presets and custom colors)"
    wsjf: 35
    baseline_bcps: 7
    stories:
      - id: e06s01
        title: "Window layout save/restore: snapshot/apply + Settings 'Finestre' section + boot restore"
        bcps: 3
      - id: e06s02
        title: "Simple theming: named palette + Scuro/Chiaro presets + 5 custom pickers + live apply + persistence"
        bcps: 4

  - id: e07
    slug: performance-optimizations
    title: "Cut measured CPU waste: Mediagrid per-push gating (P0), idle render throttle (P1), monitor refresh skip (P2)"
    wsjf: 30
    baseline_bcps: 7
    stories:
      - id: e07s01
        title: "P0 — Mediagrid per-push cost: signature-gated structural updates + per-cell value cache"
        bcps: 3
      - id: e07s02
        title: "P1 — Idle render throttle: frame_sleep() full rate while animating, throttled while idle"
        bcps: 2
      - id: e07s03
        title: "P2 — Monitor refresh: skip configure when arm static and values unchanged"
        bcps: 2

  - id: e08
    slug: help-window
    title: "Help menu entry + centered About window (ASCII logo, GPL-3.0, author)"
    wsjf: 25
    baseline_bcps: 2
    stories:
      - id: e08s01
        title: "Help menubar entry + centered About window with ASCII logo, GPL-3.0 and author line"
        bcps: 2
