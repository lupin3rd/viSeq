# Pre-commit hooks — the Python equivalent of the hook-commits skill.
# Run once:  .venv/bin/pre-commit install
# Run manually:  .venv/bin/pre-commit run --all-files
# HARD GATE: hooks must run before any commit lands. Skipping hooks
# (--no-verify) is forbidden unless explicitly authorized for a specific
# commit and documented (CONVENTIONS.md § Always Green).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # mypy and pytest run from the project venv (language: system) so they see
  # the real runtime deps (dearpygui, essentia, numpy, ...) that the app needs.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (typecheck)
        entry: .venv/bin/python -m mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest (tests)
        entry: .venv/bin/python -m pytest tests/ -q
        language: system
        pass_filenames: false
        always_run: true
