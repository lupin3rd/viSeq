# Tooling configuration (ruff / mypy / pytest) — mechanical gates (G6).
# Runtime dependencies stay in requirements.txt; no packaging metadata here.

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
# E/F = pycodestyle+pyflakes, I = isort, UP = pyupgrade, B = bugbear,
# SIM = flake8-simplify, C4 = comprehensions, RUF = ruff-specific.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# viseq.py is a single-file GUI where worker threads must survive any exception
# (BLE001 blind except, S110 bare except-pass) and module-global shared state is
# the intended design (PLW0602). Documented in CONVENTIONS.md § Defensive Code.
"viseq.py" = ["BLE001", "S110", "PLW0602"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
files = ["viseq.py", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
